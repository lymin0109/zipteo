<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>집터 — 카카오맵 뷰</title>

<!-- ─────────────────────────────────────────────────────────────────────
     실행 전 두 가지

     1) 아래 KAKAO_JS_KEY 한 줄만 본인 JavaScript 키로 바꾸세요 (SDK 주소는 자동으로 채워집니다).
        developers.kakao.com → 내 애플리케이션 → 앱 키 → JavaScript 키

     2) file:// 로 열면 동작하지 않습니다. 카카오가 도메인을 검사하기 때문입니다.
        같은 폴더에서 아래 명령으로 띄우고 http://localhost:8000/map_kakao.html 로 접속하세요.

            python -m http.server 8000

        그리고 developers.kakao.com → 앱 설정 → 플랫폼 → Web 에
        http://localhost:8000 을 사이트 도메인으로 등록해야 합니다.
     ───────────────────────────────────────────────────────────────────── -->
<script>
/* ▼▼ 여기 한 줄만 본인 JavaScript 키로 바꾸면 됩니다 ▼▼ */
const KAKAO_JS_KEY = "1165165a0d6aa1ab5ca0b55f0ffd9fc3";
/* ▲▲ ------------------------------------------ ▲▲ */
if (!KAKAO_JS_KEY.includes("1165165a0d6aa1ab5ca0b55f0ffd9fc3")) {
  document.write('<scr'+'ipt src="https://dapi.kakao.com/v2/maps/sdk.js?appkey='
    + encodeURIComponent(KAKAO_JS_KEY) + '&autoload=false&libraries=clusterer"></scr'+'ipt>');
}
</script>

<!-- build_dataset.py --emit 이 만든 파일. 없으면 아래 SAMPLE 로 대체됩니다. -->
<script src="data/apts.js" onerror="window.__noLive=1"></script>

<style>
:root{--ink:#141a17;--ink3:#717b77;--line:#d7dcd9;--surface:#fbfcfb;--bg:#eff1f0;
      --good:#0e6a4e;--mid:#9b6e17;--low:#79837f;--accent:#0e6a4e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.6 "Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px;overflow:auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:17px;margin:0}
h1 small{display:block;font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:.08em;margin-top:3px}
label.f{display:block;font-size:12px;color:var(--ink3);font-weight:600;margin-bottom:6px}
select,input[type=range]{width:100%}
select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit}
#map{width:100%;height:100%}
.legend{font-size:12px;display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:11px;height:11px;border-radius:50%;display:block}
.note{font-size:11.5px;color:var(--ink3);line-height:1.65;border-top:1px solid var(--line);padding-top:14px}
.pin{transform:translate(-50%,-50%);border-radius:999px;color:#fff;font-weight:700;font-size:12px;
     padding:5px 9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.28);border:2px solid #fff;cursor:pointer}
.iw{padding:12px 14px;min-width:210px;font-size:13px;line-height:1.7}
.iw b{font-size:14px}
.iw table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.iw td{padding:2px 0}.iw td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.err{padding:24px;font-size:13px;color:#9c3a21;line-height:1.8}
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>집터 <small>KAKAO MAP VIEW</small></h1>
    <div><label class="f">근무지</label><select id="biz"></select></div>
    <div><label class="f">색 기준</label>
      <select id="metric">
        <option value="ppy">평당가</option>
        <option value="price">실거래가</option>
        <option value="year">준공년도</option>
      </select></div>
    <div><label class="f">평형 <span id="areaLab"></span></label>
      <select id="area"><option value="s">전용 59㎡ 미만</option>
        <option value="m">전용 59~84㎡ (24~29평형)</option>
        <option value="l" selected>전용 84㎡ (34평형)</option>
        <option value="xl">전용 84㎡ 초과 대형</option></select></div>
    <div class="legend" id="legend"></div>
    <div class="note" id="note"></div>
  </aside>
  <div id="map"></div>
</div>

<script>
/* 데이터: build_dataset.py --emit 이 만든 data/apts.js 의 RAW 를 쓰고, 없으면 샘플로 화면만 확인 */
const SAMPLE = [
  {name:"래미안대치팰리스",gu:"강남구",dong:"대치동",year:2015,lat:37.4966,lng:127.0631,price:{"59":280000,"84":390000},recent:[["2026-07",84,14,382000]]},
  {name:"헬리오시티",gu:"송파구",dong:"가락동",year:2018,lat:37.5000,lng:127.1120,price:{"59":200000,"84":265000},recent:[["2026-07",84,19,258000]]},
  {name:"마포래미안푸르지오",gu:"마포구",dong:"아현동",year:2014,lat:37.5545,lng:126.9530,price:{"59":165000,"84":220000},recent:[["2026-07",84,17,214000]]},
  {name:"목동신시가지7단지",gu:"양천구",dong:"목동",year:1986,lat:37.5330,lng:126.8740,price:{"74":195000,"99":265000},recent:[["2026-06",99,9,258000]]},
  {name:"상계주공7단지",gu:"노원구",dong:"상계동",year:1988,lat:37.6600,lng:127.0625,price:{"49":62000,"59":78000},recent:[["2026-06",59,9,75000]]}
];
/* build_dataset.py --emit 은 `const RAW = [[...], ...]` 를 만듭니다(객체가 아니라 열 배열).
   예전 코드는 RAW_LIVE 라는 이름의 객체 배열을 기대해서, apts.js 가 정상적으로 200으로
   로드돼도 항상 SAMPLE 5곳만 보였습니다. 이름과 형태를 둘 다 맞춰줍니다. */
const COLS = ["name","gu","dong","year","units","brand","far","park","lat","lng",
              "st","sw","lines","price","recent","edu","inf","fut","commute"];
const SRC = (typeof RAW !== "undefined" && RAW.length) ? RAW
          : (typeof RAW_LIVE !== "undefined" && RAW_LIVE.length) ? RAW_LIVE : null;
const APTS = SRC
  ? SRC.map(r => Array.isArray(r) ? Object.fromEntries(COLS.map((c,j)=>[c,r[j]])) : r)
  : SAMPLE;
const LIVE = SRC !== null;

const BIZ = [
  {id:"gangnam",n:"강남·역삼·삼성",lat:37.4979,lng:127.0276},{id:"yeouido",n:"여의도",lat:37.5215,lng:126.9245},
  {id:"gwanghwa",n:"광화문·종로",lat:37.5720,lng:126.9769},{id:"euljiro",n:"을지로·시청",lat:37.5663,lng:126.9829},
  {id:"jamsil",n:"잠실",lat:37.5133,lng:127.1000},{id:"magok",n:"마곡",lat:37.5590,lng:126.8320},
  {id:"guro",n:"구로·가산디지털",lat:37.4802,lng:126.8826},{id:"sangam",n:"상암 DMC",lat:37.5796,lng:126.8895},
  {id:"yongsan",n:"용산",lat:37.5299,lng:126.9648},{id:"seongsu",n:"성수·왕십리",lat:37.5445,lng:127.0557},
  {id:"yangjae",n:"양재·우면",lat:37.4837,lng:127.0342},{id:"pangyo",n:"판교",lat:37.3948,lng:127.1112}
];

/* 앱(seoul-apt-fit)과 같은 구간. 데이터의 면적이 반올림돼 있어 경계가 58·82·90 입니다.
   59형은 58~60, 84형은 82~85 로 흩어져 들어옵니다. */
const SB = a => a<58?"s":a<82?"m":a<90?"l":"xl";
const won = v => { const n=Math.round(v),e=Math.floor(n/10000),m=n%10000;
  return n>=10000 ? e+"억"+(m?" "+m.toLocaleString():"") : n.toLocaleString()+"만"; };
const pick = (apt,bucket) => {           // 선택한 평형대에서 가장 큰 타입
  const ks=Object.keys(apt.price).map(Number).filter(k=>SB(k)===bucket);
  if(!ks.length) return null;
  const k=Math.max(...ks); return {area:k, price:apt.price[k]};
};
const ppyOf = (price,area) => Math.round(price/(area/3.3058*1.32));   // 전용→공급 환산 후 평당

if (KAKAO_JS_KEY.includes("여기에") || !window.kakao || !kakao.maps) {
  document.getElementById("map").innerHTML =
    `<div class="err">카카오맵 SDK가 로드되지 않았습니다.<br><br>
     1. 이 파일 상단의 <b>KAKAO_JS_KEY</b> 한 줄을 JavaScript 키로 바꾸세요.<br>
     2. <b>python -m http.server 8000</b> 으로 띄우고 http://localhost:8000/map_kakao.html 로 접속하세요.<br>
     3. developers.kakao.com → 플랫폼 → Web 에 <b>http://localhost:8000</b> 을 등록하세요.</div>`;
} else kakao.maps.load(init);

function init(){
  const map = new kakao.maps.Map(document.getElementById("map"),
    {center:new kakao.maps.LatLng(37.5326,126.9905), level:8});
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  const bizSel=document.getElementById("biz");
  BIZ.forEach(b=>bizSel.add(new Option(b.n,b.id)));

  let overlays=[], bizMarker=null, circles=[], open=null;
  const clear=()=>{overlays.forEach(o=>o.setMap(null)); overlays=[];
    circles.forEach(c=>c.setMap(null)); circles=[];
    if(bizMarker) bizMarker.setMap(null); if(open) open.close();};

  function draw(){
    clear();
    const bucket=document.getElementById("area").value;
    const metric=document.getElementById("metric").value;
    const rows=APTS.map(a=>{const p=pick(a,bucket); return p?{a,...p}:null;}).filter(Boolean);

    const val=r=> metric==="year" ? r.a.year
               : metric==="price" ? r.price
               : ppyOf(r.price,r.area);
    const vs=rows.map(val).sort((x,y)=>x-y);
    const q=p=>vs[Math.floor((vs.length-1)*p)];
    const lo=q(0.33), hi=q(0.67);
    const col=v=> v>=hi ? "#9c2f1f" : v>=lo ? "#9b6e17" : "#0e6a4e";

    rows.forEach(r=>{
      const pos=new kakao.maps.LatLng(r.a.lat,r.a.lng);
      const el=document.createElement("div");
      el.className="pin"; el.style.background=col(val(r));
      el.textContent = metric==="year" ? r.a.year
                     : metric==="price" ? won(r.price)
                     : ppyOf(r.price,r.area).toLocaleString();
      const ov=new kakao.maps.CustomOverlay({position:pos,content:el,yAnchor:.5,clickable:true});
      ov.setMap(map); overlays.push(ov);

      el.onclick=()=>{
        if(open) open.close();
        const rt=(r.a.recent||[]).map(([d,ar,f,v])=>
          `<tr><td>${d}</td><td>${ar}㎡ ${f}층</td><td>${won(v)}</td></tr>`).join("");
        open=new kakao.maps.InfoWindow({position:pos, content:
          `<div class="iw"><b>${r.a.name}</b><br>
             <span style="color:#717b77">${r.a.gu} ${r.a.dong} · ${r.a.year}년 준공</span>
             <table><tr><td>전용 ${r.area}㎡</td><td><b>${won(r.price)}</b></td></tr>
             <tr><td>평당</td><td>${ppyOf(r.price,r.area).toLocaleString()}만</td></tr>${rt}</table></div>`});
        open.open(map);
      };
    });

    // 근무지 + 거리 링 (실측 통근시간이 있으면 그 값을 팝업에 함께 보여준다)
    const b=BIZ.find(x=>x.id===bizSel.value), bp=new kakao.maps.LatLng(b.lat,b.lng);
    bizMarker=new kakao.maps.CustomOverlay({position:bp,yAnchor:.5,content:
      `<div class="pin" style="background:#141a17">${b.n}</div>`});
    bizMarker.setMap(map);
    [5000,10000,15000].forEach(rad=>{
      const c=new kakao.maps.Circle({center:bp,radius:rad,strokeWeight:1,strokeColor:"#141a17",
        strokeOpacity:.35,strokeStyle:"dashed",fillOpacity:0});
      c.setMap(map); circles.push(c);
    });

    document.getElementById("legend").innerHTML =
      [["#0e6a4e","하위 1/3"],["#9b6e17","중간"],["#9c2f1f","상위 1/3"]]
      .map(([c,t])=>`<div><i style="background:${c}"></i>${t}</div>`).join("")
      + `<div><i style="background:#141a17"></i>근무지 · 반경 5/10/15km</div>`;
    document.getElementById("areaLab").textContent = `(${rows.length}곳)`;
  }

  document.getElementById("note").innerHTML = LIVE
    ? `국토부 실거래가 기반 <b>${APTS.length.toLocaleString()}개 단지</b>를 표시하고 있습니다.`
    : `<b>샘플 5개</b>로 표시 중입니다. <code>build_dataset.py --emit</code> 으로
       <code>data/apts.js</code> 를 만들면 자동으로 실데이터로 바뀝니다.`;

  ["biz","metric","area"].forEach(id=>document.getElementById(id).onchange=draw);
  draw();
}
</script>
</body>
</html>
